spring:
  application:
    name: tonti-backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        default_batch_fetch_size: 20

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null
    time-zone: UTC

server:
  port: ${PORT:${SERVER_PORT:8080}}
  # Derrière le proxy de l'hébergeur (Railway, Fly, ALB…) : IP client et schéma réels
  forward-headers-strategy: framework
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
  compression:
    enabled: true
    mime-types: application/json,text/html,text/plain

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

logging:
  level:
    root: INFO
    com.tonti: INFO

springdoc:
  api-docs:
    path: /api-docs
    enabled: ${API_DOCS_ENABLED:true}
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

app:
  jwt:
    secret: ${JWT_SECRET:dev-secret-key-must-be-at-least-256-bits-long-for-hs256-algorithm}
    expiration: ${JWT_EXPIRATION_MS:3600000}             # 1 heure
    refresh-expiration: ${JWT_REFRESH_EXPIRATION_MS:2592000000}  # 30 jours

  cors:
    # Web + application native (capacitor://localhost sur iOS, https://localhost sur Android)
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173,capacitor://localhost,https://localhost}

  urls:
    api-base-url: ${API_BASE_URL:http://localhost:8080}
    web-base-url: ${WEB_BASE_URL:http://localhost:5173}
    app-scheme: ${APP_URL_SCHEME:tonti}

  stripe:
    enabled: ${STRIPE_ENABLED:false}
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}

  rate-limit:
    auth-requests: ${AUTH_RATE_LIMIT:10}
    auth-window: 1m

---
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/tonti_db}
    username: ${DATABASE_USERNAME:tonti}
    password: ${DATABASE_PASSWORD:tonti_secret}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    show-sql: true

server:
  error:
    include-message: always

logging:
  level:
    com.tonti: DEBUG

---
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME:}
    password: ${DATABASE_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 5
      connection-timeout: 30000

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}

logging:
  level:
    root: WARN
    com.tonti: INFO

app:
  jwt:
    # Obligatoire en production (aucune valeur par défaut) : openssl rand -base64 64
    secret: ${JWT_SECRET}
  stripe:
    enabled: ${STRIPE_ENABLED:true}
