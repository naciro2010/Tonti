version: '3.8'

services:
  # ============================================
  # PostgreSQL Database
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: tonti-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tonti_db
      POSTGRES_USER: tonti
      POSTGRES_PASSWORD: tonti_secret
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tonti -d tonti_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tonti-network

  # ============================================
  # Tonti Backend
  # ============================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tonti-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://postgres:5432/tonti_db
      DATABASE_USERNAME: tonti
      DATABASE_PASSWORD: tonti_secret
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      API_BASE_URL: ${API_BASE_URL:-http://localhost:8080}
      WEB_BASE_URL: ${WEB_BASE_URL:-http://localhost:5173}
      STRIPE_ENABLED: ${STRIPE_ENABLED:-false}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173,capacitor://localhost}
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    networks:
      - tonti-network

volumes:
  postgres_data:

networks:
  tonti-network:
    driver: bridge
